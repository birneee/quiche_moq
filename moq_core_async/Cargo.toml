[package]
name = "moq_core_async"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Async building blocks driving the sans-IO session of moq_core"
readme = "README.md"
repository.workspace = true
keywords = ["moq", "quic", "media", "streaming", "webtransport"]

[dependencies]
moq_core = { workspace = true }
moq_object_cache = { workspace = true }
log = { workspace = true }
# futures-channel only (oneshot/mpsc) — no executor, no platform deps, same
# constraint as the rest of this crate.
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
moq_core = { workspace = true, features = ["test-utils"] }
